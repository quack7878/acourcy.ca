<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ariane Courcy</title>
  <link rel="stylesheet" href="styles.css">
</head>

<style>
  html {
    height: 100%;
  }

  body, html {
    display: flex;
    flex-grow: 1;
    align-self: stretch;
  }

  body {
    flex-direction: column;
    margin: 0;
    text-transform: full-width;
  }

  #header {
    display: flex;
    align-self: stretch;
    background-color: #a6ca93;
    justify-content: center;
    flex-direction: column;
  }

  #header-buttons {
    display: flex;
    align-self: end;
    padding: 8px;
  }

  .github-svg {
    text-decoration: none;
    width: 24px;
  }

  #projects-link {
    text-decoration: none;
    color: black;
    font-size: 16px;
  }

  #projects-link:hover {
    color: #ebedee;
  }

  .header-separators {
    width: 1px;
    height: 24px;
    background-color: #ebedee;
    margin-left: 16px;
    margin-right: 16px;
  }

  #under-name {
    width: 60%;
    height: 2px;
    background-color: #ebedee;
    align-self: center;
  }

  #name {
    font-size: 40px;
    align-self: center;
    margin: 16px;
  }

  #main-container {
    display: flex;
    flex-grow: 1;
    align-self: stretch;
    padding-left: 34px;
  }

  #projects {
    display: flex;
    flex-grow: 1;
    align-self: stretch;
    flex-direction: column;
  }

  #rotationeasy-container {
    display: flex;
    flex-grow: 1;
    align-self: stretch;
    flex-direction: column;
    padding-left: 8px;
  }

  .separator {
    width: 90%;
    height: 2px;
    background-color: #ebedee;
  }

  .titles {
    font-size: 24px;
  }

  .subtitles {
    font-size: 20px;
    text-decoration: underline;
  }

  .chips {
    display: flex;
    gap: 8px;
    font-size: 12px;
  }

  .chip {
    border-radius: 4px; 
    padding: 2px;
  }

</style>

<body>
  <header id="header">

    <p id="name"><b>Ariane Courcy</b></p>
    <div id="under-name"></div>

    <div id=header-buttons>
      <a id="projects-link" href="#project">Projects</a>
      <div class="header-separators"></div>
      <a class="github-svg" href="https://github.com/quack7878" target="_blank">
        <img class="github-svg" src="assets/github.svg" alt="">
      </a>
    </div>

  </header>

  <div id="main-container">

    <div id="projects">

      <p id=title-projects class="titles"><b>Projects</b></p>
      <div class="separator"></div>

      <div id="rotationeasy-container">
        <p class="subtitles">Rotationeasy</p>
        <p>A static web app to teach volley-ball rotations.</p>
        <div class="chips">
          <div style="background-color: #dd4a24" class="chip">HTML</div>
          <div style="background-color: #ccb028"class="chip">Javascript</div>
        </div>
         <video style="margin-top: 16px" width="500" height="600" controls>
          <source src="assets/rotationeasy.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>

    </div>

  </div>
</body>
</html>
