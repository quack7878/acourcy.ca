<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ariane Courcy</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>
  <header id="header">

    <h1 id="name">Ariane Courcy</h1>
    <div id="under-name"></div>

    <div id=header-buttons>
      <a id="projects-link" href="#projects">Projects</a>
      <div class="header-separators"></div>
      <a class="github-svg" href="https://github.com/quack7878" target="_blank">
        <img class="github-svg" src="assets/github.svg" alt="">
      </a>
    </div>

  </header>

  <div id="main-container">

    <div id="projects">

      <h1 id=title-projects class="titles">Projects</h1>
      <div class="separator"></div>

      <div id="rotationeasy-container">
        <h2 class="subtitles">Rotationeasy</h2>
        <p id="rotationeasy-desc">A static web app to teach volley-ball rotations.</p>
        <div class="chips">
          <div style="background-color: #dd4a24" class="chip">HTML</div>
          <div style="background-color: #ccb028"class="chip">Javascript</div>
        </div>
         <video style="margin-top: 16px" width="300" height="500" controls>
          <source src="assets/rotationeasy.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>

    </div>

  </div>
</body>
</html>
